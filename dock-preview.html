<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Office | Prévia do dock</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101b27; color: #e8eff1; font-family: system-ui, sans-serif; }
    main { max-width: 1450px; margin: 0 auto; padding: 28px 20px; }
    h1 { font-size: 18px; margin: 0 0 6px; }
    p { color: #a5b7bc; font-size: 14px; margin: 0 0 22px; }
    #preview { width: fit-content; max-width: 100%; line-height: 0; background: #41a6f6; }
    canvas { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }
  </style>
</head>
<body>
  <main>
    <h1>Prévia do dock</h1>
    <p>Área de café, mesa de descanso e baias em uma faixa para o dock.</p>
    <div id="preview" role="img" aria-label="Área de café e descanso, três duplas de baias e uma baia individual."></div>
  </main>
  <script type="module" src="/src/dock-preview/main.js"></script>
</body>
</html>
