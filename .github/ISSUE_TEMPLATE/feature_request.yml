name: Feature request
description: Suggest an idea for the office.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        My Office is a local, view-only office for agent sessions. Ideas that keep it that way, and that send only session metadata, fit best.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen? Mention the web office, the Kitty dock or both.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, if any.
