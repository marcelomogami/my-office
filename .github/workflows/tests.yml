name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install pillow

      - name: Backend tests
        run: npm test

      - name: Dock tests
        run: python -m unittest discover -s tools/dock -p 'test_*.py'

      - name: Build web office
        run: npm run build
