<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101b27" />
  <title>My Office</title>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-icon" aria-hidden="true">▦</span><span>my office</span></div><span class="top-label" data-i18n="tagline"></span></header>
  <main class="app">
    <div class="office-wrap">
      <div id="office" role="img" data-i18n-label="officeLabel"></div>
      <div id="tooltip" class="tooltip" hidden></div>
      <div id="offline" class="offline" role="status" hidden></div>
    </div>
    <aside class="sessions" data-i18n-label="sessionsLabel">
      <p class="sessions-title" data-i18n="manager"></p>
      <ul id="manager"></ul>
      <button id="boss-edit" class="boss-edit" type="button" data-i18n="boss.edit"></button>
      <p class="sessions-title" data-i18n="sessions"></p>
      <ul id="sessions"></ul>
    </aside>
  </main>
  <dialog id="boss-dialog" class="boss-dialog" aria-labelledby="boss-dialog-title">
    <form id="boss-form">
      <h2 id="boss-dialog-title" data-i18n="boss.title"></h2>
      <p class="boss-field-label" id="boss-emotes-label" data-i18n="boss.emote"></p>
      <div id="boss-emotes" class="boss-emotes" role="radiogroup" aria-labelledby="boss-emotes-label"></div>
      <label class="boss-field-label" for="boss-text" data-i18n="boss.text"></label>
      <input id="boss-text" type="text" maxlength="320" autocomplete="off" />
      <p id="boss-error" class="boss-error" role="alert" hidden></p>
      <div class="boss-actions">
        <button id="boss-clear" type="button" data-i18n="boss.clear"></button>
        <button id="boss-cancel" type="button" data-i18n="boss.cancel"></button>
        <button class="boss-save" type="submit" data-i18n="boss.save"></button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
